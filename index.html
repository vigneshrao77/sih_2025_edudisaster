<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="EduDisaster: Personalized Disaster Preparedness Platform"
    />
    <title>EduDisaster | Preparedness Platform</title>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"Outfit"', 'sans-serif'],
            },
            colors: {
              primary: '#34765A',   // Forest Green (Primary buttons, safe status)
              secondary: '#172B3A', // Deep Navy (Navigation, headers)
              accent: '#E6A23C',    // Muted Orange (Warnings, alerts)
              danger: '#C74747',    // Emergency Red (Critical alerts)
              warning: '#E6A23C',
              light: '#172B3A',     // Mapped to Deep Navy (formerly white text for headings)
              dark: {
                DEFAULT: '#172B3A',
                100: '#172B3A', // Deep Navy (Headings)
                200: '#303A40', // Charcoal (Body text)
                300: '#5C6B73', // Secondary text
                400: '#8A969E', // Muted text
                500: '#A4AFB5',
                600: '#C4C8C5',
                700: '#E2E2DC', // Borders
                800: '#FFFFFF', // Card BG (Pure White)
                900: '#F7F7F2', // Main BG (Warm White)
              },
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
  }
}
</script>
</head>
  <body class="bg-dark-900 text-dark-200">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
